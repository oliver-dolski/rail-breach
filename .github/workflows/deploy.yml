# CI and GitHub Pages deployment for Rail Breach.
#
# Every push and pull request runs the full set of gates on Linux (a case-sensitive file system,
# like the Pages build host). Only a push to main publishes: the deploy job uploads dist/ and
# nothing else, and the site is keyless (no secret is read anywhere in this file).
#
# One-time step for the repository owner: Settings > Pages > Source = "GitHub Actions".
# Until that is set, the configure-pages step in the deploy job fails with a message saying so.
#
# Every action is pinned to a full commit SHA, with its release tag in the trailing comment, so a
# moved or hijacked tag cannot change what runs with the deploy token. Only the official actions/*
# repositories are used. To refresh a pin, read the tag's commit with
#   git ls-remote --tags https://github.com/actions/<name> "refs/tags/v<major>.*"
# (for an annotated tag take the peeled line ending in ^{}), then update the SHA and the comment.
name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The history scan below needs every commit, not only the tip.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # In CI the untracked local lists are absent, so this is the detective backstop on the shape
      # rules (keys, addresses, user paths, attribution phrasing, long dashes, ignored paths). The
      # preventive gate is the local run with --require-local before the owner pushes.
      - name: Scan the git history
        run: npm run scan:history

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck the core
        run: npm run typecheck:core

      - name: Lint
        run: npm run lint

      - name: Lint the core determinism rules
        run: npm run lint:core

      - name: Build
        run: npm run build

      # After the build on purpose: the dist checks in tests/app/csp.test.ts (the CSP and no API key
      # in the bundle) only run when dist/ exists. The ATT&CK ID gate runs here as well.
      - name: Test
        run: npm test

      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # A deployment that has started finishes; the newest queued run follows it.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
